services:
  - type: web
    name: diligencia-elite-rj
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
    disk:
      name: diligencia-state
      mountPath: /var/data
      sizeGB: 1
