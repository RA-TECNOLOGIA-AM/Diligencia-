<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Diligência Elite RJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Recuperar Senha</h1>
                <p>Digite seu email para receber um link de recuperação</p>
            </div>

            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText">Enviar Link de Recuperação</span>
                    <span class="spinner" id="spinner" style="display: none;"></span>
                </button>

                <span class="error-message" id="generalError"></span>
                <span class="success-message" id="successMessage"></span>
            </form>

            <div class="auth-footer">
                Lembrou sua senha? <a href="/login" class="link-primary">Fazer login</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            document.getElementById('generalError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('spinner').style.display = 'inline-block';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('generalError').textContent = data.error || 'Erro ao solicitar recuperação';
                    return;
                }

                document.getElementById('successMessage').innerHTML = `
                    ✓ Link de recuperação enviado!<br>
                    <small>Verifique seu email para as instruções de recuperação de senha.</small>
                `;
            } catch (error) {
                document.getElementById('generalError').textContent = 'Erro de conexão. Tente novamente.';
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('btnText').style.display = 'inline';
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
