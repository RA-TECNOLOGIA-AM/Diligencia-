<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Diligência Elite RJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Redefinir Senha</h1>
                <p>Crie uma nova senha para sua conta</p>
            </div>

            <form id="resetForm" class="auth-form">
                <input type="hidden" id="token" name="token">

                <div class="form-group">
                    <label for="password">Nova Senha</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength" id="strengthMeter">
                        <div class="strength-bar"></div>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText">Redefinir Senha</span>
                    <span class="spinner" id="spinner" style="display: none;"></span>
                </button>

                <span class="error-message" id="generalError"></span>
                <span class="success-message" id="successMessage"></span>
            </form>

            <div class="auth-footer">
                <a href="/login" class="link-primary">Voltar para login</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('generalError').textContent = 'Token inválido ou expirado';
            document.getElementById('resetForm').style.display = 'none';
        } else {
            document.getElementById('token').value = token;
        }

        document.getElementById('togglePassword').addEventListener('click', (e) => {
            e.preventDefault();
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', (e) => {
            e.preventDefault();
            const input = document.getElementById('confirmPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculatePasswordStrength(password);
            const bar = document.querySelector('.strength-bar');
            bar.style.width = strength.percentage + '%';
            bar.className = 'strength-bar strength-' + strength.level;
        });

        function calculatePasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)) score++;

            const levels = ['weak', 'fair', 'good', 'strong', 'very-strong'];
            return {
                level: levels[Math.min(score - 1, 4)] || 'weak',
                percentage: (score / 5) * 100
            };
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            document.getElementById('generalError').textContent = '';
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('spinner').style.display = 'inline-block';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        new_password: password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('generalError').textContent = data.error || 'Erro ao redefinir senha';
                    return;
                }

                document.getElementById('successMessage').textContent = 'Senha redefinida com sucesso! Redirecionando...';
                setTimeout(() => window.location.href = '/login', 2000);
            } catch (error) {
                document.getElementById('generalError').textContent = 'Erro de conexão. Tente novamente.';
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('btnText').style.display = 'inline';
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
